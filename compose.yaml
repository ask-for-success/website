services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${AFS_DB_NAME:-afs}
      POSTGRES_USER: ${AFS_DB_USER:-afs}
      POSTGRES_PASSWORD: ${AFS_DB_PASSWORD:-afs}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AFS_DB_USER:-afs} -d ${AFS_DB_NAME:-afs}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${AFS_DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${AFS_STORAGE_ACCESS_KEY:-afs-local-access}
      AWS_SECRET_ACCESS_KEY: ${AFS_STORAGE_SECRET_KEY:-afs-local-secret-change-me}
      WEED_ADMIN_PASSWORD: ${AFS_SEAWEEDFS_ADMIN_PASSWORD:-afs-local-admin-change-me}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    ports:
      - "127.0.0.1:${AFS_STORAGE_S3_HOST_PORT:-8333}:8333"
      - "127.0.0.1:${AFS_SEAWEEDFS_ADMIN_HOST_PORT:-12535}:12535"
      - "127.0.0.1:${AFS_SEAWEEDFS_FILER_HOST_PORT:-8888}:8888"
      - "127.0.0.1:${AFS_SEAWEEDFS_MASTER_HOST_PORT:-9333}:9333"
    volumes:
      - seaweedfs_data:/data

  storage-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py initialize_storage
    environment:
      AFS_STORAGE_BACKEND: seaweedfs
      AFS_STORAGE_S3_ENDPOINT_URL: http://seaweedfs:8333
      AFS_STORAGE_PUBLIC_BASE_URL: ${AFS_STORAGE_PUBLIC_BASE_URL:-http://localhost:8333/afs-public-media}
      AFS_STORAGE_ACCESS_KEY: ${AFS_STORAGE_ACCESS_KEY:-afs-local-access}
      AFS_STORAGE_SECRET_KEY: ${AFS_STORAGE_SECRET_KEY:-afs-local-secret-change-me}
      AFS_STORAGE_PUBLIC_BUCKET: ${AFS_STORAGE_PUBLIC_BUCKET:-afs-public-media}
      AFS_STORAGE_PRIVATE_BUCKET: ${AFS_STORAGE_PRIVATE_BUCKET:-afs-private-files}
      AFS_STORAGE_REGION: ${AFS_STORAGE_REGION:-us-east-1}
    depends_on:
      seaweedfs:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - path: .env
        required: false
    environment:
      AFS_DB_HOST: database
      AFS_STORAGE_BACKEND: seaweedfs
      AFS_STORAGE_S3_ENDPOINT_URL: http://seaweedfs:8333
      AFS_STORAGE_PUBLIC_BASE_URL: ${AFS_STORAGE_PUBLIC_BASE_URL:-http://localhost:8333/afs-public-media}
      AFS_STORAGE_ACCESS_KEY: ${AFS_STORAGE_ACCESS_KEY:-afs-local-access}
      AFS_STORAGE_SECRET_KEY: ${AFS_STORAGE_SECRET_KEY:-afs-local-secret-change-me}
      AFS_STORAGE_PUBLIC_BUCKET: ${AFS_STORAGE_PUBLIC_BUCKET:-afs-public-media}
      AFS_STORAGE_PRIVATE_BUCKET: ${AFS_STORAGE_PRIVATE_BUCKET:-afs-private-files}
      AFS_STORAGE_REGION: ${AFS_STORAGE_REGION:-us-east-1}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  backup:
    profiles: ["operations"]
    image: afs-backup-tool:local
    build:
      context: .
      dockerfile: operations/backup/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      AFS_DB_HOST: database
      AFS_DB_PORT: 5432
      AFS_DB_NAME: ${AFS_DB_NAME:-afs}
      AFS_DB_USER: ${AFS_DB_USER:-afs}
      AFS_DB_PASSWORD: ${AFS_DB_PASSWORD:-afs}
      AFS_STORAGE_S3_ENDPOINT_URL: http://seaweedfs:8333
      AFS_STORAGE_ACCESS_KEY: ${AFS_STORAGE_ACCESS_KEY:-afs-local-access}
      AFS_STORAGE_SECRET_KEY: ${AFS_STORAGE_SECRET_KEY:-afs-local-secret-change-me}
      AFS_STORAGE_PUBLIC_BUCKET: ${AFS_STORAGE_PUBLIC_BUCKET:-afs-public-media}
      AFS_STORAGE_PRIVATE_BUCKET: ${AFS_STORAGE_PRIVATE_BUCKET:-afs-private-files}
      AFS_STORAGE_REGION: ${AFS_STORAGE_REGION:-us-east-1}
      AFS_BACKUP_ROOT: /backups
      AFS_BACKUP_APP_VERSION: ${AFS_BACKUP_APP_VERSION:-local-development}
      AFS_BACKUP_REPOSITORY: ${AFS_BACKUP_REPOSITORY:-}
      AFS_BACKUP_PASSWORD_FILE: ${AFS_BACKUP_PASSWORD_FILE:-}
      AFS_BACKUP_RETENTION_DAILY: ${AFS_BACKUP_RETENTION_DAILY:-14}
      AFS_BACKUP_RETENTION_WEEKLY: ${AFS_BACKUP_RETENTION_WEEKLY:-8}
      AFS_BACKUP_RETENTION_MONTHLY: ${AFS_BACKUP_RETENTION_MONTHLY:-12}
    volumes:
      - ${AFS_BACKUP_HOST_PATH:-./backups}:/backups
    depends_on:
      database:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

volumes:
  postgres_data:
  seaweedfs_data:
